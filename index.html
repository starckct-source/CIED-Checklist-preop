<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIED Präoperative Checkliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2744;
  --navy-mid: #1a3a5c;
  --navy-light: #234b75;
  --blue: #2563a8;
  --blue-bright: #3b82f6;
  --sky: #e8f0fb;
  --sky-dark: #cdddf5;
  --white: #ffffff;
  --off-white: #f7f9fc;
  --gray-100: #eef1f6;
  --gray-300: #c8d0dd;
  --gray-500: #7a8899;
  --gray-700: #3d4a5c;
  --text: #1a2535;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --amber-border: #fbbf24;
  --red: #b91c1c;
  --red-light: #fef2f2;
  --red-border: #fca5a5;
  --green: #15803d;
  --green-light: #f0fdf4;
  --green-border: #86efac;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(15,39,68,0.08), 0 4px 16px rgba(15,39,68,0.06);
  --shadow-lg: 0 8px 32px rgba(15,39,68,0.12), 0 2px 8px rgba(15,39,68,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── HEADER ── */
.app-header {
  background: var(--navy);
  color: white;
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.header-inner {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px 20px 12px;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.header-logo {
  width: 36px; height: 36px;
  background: var(--blue-bright);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header-title h1 {
  font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
  line-height: 1.2;
}
.header-title p {
  font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px;
  font-weight: 400; letter-spacing: 0.02em; text-transform: uppercase;
}
.reset-btn {
  margin-left: auto;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.reset-btn:hover { background: rgba(255,255,255,0.18); color: white; }

/* Progress bar */
.progress-bar-wrap {
  background: rgba(255,255,255,0.1);
  border-radius: 100px;
  height: 5px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue-bright), #60a5fa);
  border-radius: 100px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 11px; color: rgba(255,255,255,0.5);
  margin-bottom: 5px;
}
.progress-label strong { color: rgba(255,255,255,0.85); font-weight: 600; }

/* ── MAIN ── */
.main {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

/* ── SECTION NAV PILLS ── */
.section-nav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.nav-pill {
  padding: 5px 11px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 500;
  background: var(--white);
  border: 1.5px solid var(--gray-300);
  color: var(--gray-500);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.nav-pill:hover { border-color: var(--blue); color: var(--blue); }
.nav-pill.active { background: var(--navy); border-color: var(--navy); color: white; }
.nav-pill.done { background: var(--green-light); border-color: var(--green-border); color: var(--green); }

/* ── SECTION CARD ── */
.section-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  overflow: hidden;
  border: 1.5px solid transparent;
  transition: border-color 0.2s;
}
.section-card.active { border-color: var(--blue-bright); }
.section-card.complete { border-color: var(--green-border); }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.section-header:hover { background: var(--off-white); }

.section-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--sky);
  color: var(--blue);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.section-card.complete .section-num {
  background: var(--green-light);
  color: var(--green);
}
.section-card.active .section-num {
  background: var(--blue);
  color: white;
}

.section-title-wrap { flex: 1; min-width: 0; }
.section-title {
  font-size: 14px; font-weight: 600;
  color: var(--navy); line-height: 1.3;
}
.section-subtitle {
  font-size: 11px; color: var(--gray-500); margin-top: 1px;
}

.section-status {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.section-count {
  font-size: 12px; color: var(--gray-500);
  font-family: 'DM Mono', monospace;
}
.section-count.done { color: var(--green); }
.chevron {
  font-size: 16px; color: var(--gray-300);
  transition: transform 0.25s;
}
.section-card.open .chevron { transform: rotate(180deg); }

.section-body {
  display: none;
  border-top: 1px solid var(--gray-100);
}
.section-card.open .section-body { display: block; }

/* ── CHECK ITEMS ── */
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--gray-100);
  transition: background 0.12s;
  cursor: pointer;
}
.check-item:last-child { border-bottom: none; }
.check-item:hover { background: var(--off-white); }
.check-item.checked { background: var(--green-light); }
.check-item.warning { background: var(--amber-light); border-left: 3px solid var(--amber-border); }
.check-item.warning.checked { background: #d1fae5; }
.check-item.critical { background: var(--red-light); border-left: 3px solid var(--red-border); }
.check-item.critical.checked { background: var(--green-light); }

.checkbox {
  width: 22px; height: 22px;
  border: 2px solid var(--gray-300);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
  background: white;
}
.check-item.checked .checkbox {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.checkbox-check { font-size: 13px; display: none; }
.check-item.checked .checkbox-check { display: block; }

.check-content { flex: 1; min-width: 0; }
.check-label {
  font-size: 14px; font-weight: 500;
  color: var(--text); line-height: 1.4;
  display: flex; align-items: flex-start; gap: 6px;
}
.check-item.checked .check-label { color: var(--gray-500); text-decoration: line-through; }
.required-star { color: var(--red); font-size: 13px; flex-shrink: 0; margin-top: 1px; }
.check-note {
  font-size: 12px; color: var(--gray-500);
  margin-top: 2px; font-style: italic;
}

/* Info button */
.info-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--sky-dark);
  background: var(--sky);
  color: var(--blue);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 2px;
  transition: all 0.15s;
  text-decoration: none;
}
.info-btn:hover { background: var(--blue); color: white; border-color: var(--blue); }

/* ── ALERT ROWS ── */
.alert-row {
  display: flex; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--gray-100);
  align-items: flex-start;
}
.alert-row.warning { background: var(--amber-light); }
.alert-row.danger { background: var(--red-light); }
.alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.alert-text { font-size: 13px; color: var(--gray-700); line-height: 1.5; }

/* ── SECTION BADGE (conditional) ── */
.conditional-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--navy);
  color: white;
  font-size: 10px; font-weight: 600;
  padding: 2px 7px;
  border-radius: 100px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-left: 6px;
}

/* ── MODAL / DRAWER ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,40,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white;
  border-radius: var(--radius) var(--radius) 12px 12px;
  max-width: 600px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-header {
  background: var(--navy);
  color: white;
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  border-radius: var(--radius) var(--radius) 0 0;
}
.modal-title { font-size: 14px; font-weight: 600; }
.modal-close {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.15);
  border: none; border-radius: 6px;
  color: white; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: rgba(255,255,255,0.25); }
.modal-body {
  padding: 20px;
  font-size: 14px; line-height: 1.7; color: var(--gray-700);
}
.modal-body h4 {
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--blue); margin: 16px 0 6px;
}
.modal-body h4:first-child { margin-top: 0; }
.modal-body p { margin-bottom: 10px; }
.modal-body ul { padding-left: 18px; }
.modal-body ul li { margin-bottom: 4px; }
.modal-body .highlight-box {
  background: var(--amber-light);
  border-left: 3px solid var(--amber);
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 13px;
}
.modal-body .ref-box {
  background: var(--sky);
  border-radius: 6px;
  padding: 10px 14px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--gray-500);
  font-style: italic;
}

/* ── SUMMARY PAGE ── */
.summary-card {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1.5px solid var(--green-border);
}
.summary-header {
  background: var(--navy);
  color: white;
  padding: 20px;
  text-align: center;
}
.summary-header h2 { font-size: 20px; font-weight: 700; }
.summary-header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }
.summary-body { padding: 20px; }
.summary-row {
  display: flex; align-items: center;
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 14px;
  gap: 10px;
}
.summary-row.ok { background: var(--green-light); color: var(--green); }
.summary-row.warn { background: var(--amber-light); color: var(--amber); }
.summary-row.incomplete { background: var(--red-light); color: var(--red); }
.summary-row-icon { font-size: 16px; flex-shrink: 0; }
.summary-row-text { flex: 1; font-weight: 500; }
.summary-row-count { font-family: 'DM Mono', monospace; font-size: 12px; }

.summary-actions { display: flex; gap: 10px; padding: 0 20px 20px; }
.btn-primary {
  flex: 1; padding: 12px;
  background: var(--navy);
  color: white; border: none;
  border-radius: 8px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--navy-light); }
.btn-secondary {
  flex: 1; padding: 12px;
  background: white;
  color: var(--navy);
  border: 1.5px solid var(--gray-300);
  border-radius: 8px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.btn-secondary:hover { border-color: var(--navy); }

/* ── FLOATING SUMMARY BUTTON ── */
.fab {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--navy);
  color: white;
  border: none; border-radius: 50px;
  padding: 14px 22px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(15,39,68,0.3);
  font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.2s;
  z-index: 90;
}
.fab:hover { background: var(--blue); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(15,39,68,0.35); }
.fab-dot {
  width: 8px; height: 8px;
  background: var(--blue-bright);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.8); }
}

/* ── PAGE VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* Responsive */
@media (max-width: 600px) {
  .section-nav { display: none; }
  .fab { bottom: 16px; right: 16px; padding: 12px 18px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- MODAL OVERLAY -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Information</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- HEADER -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="header-logo">🫀</div>
      <div class="header-title">
        <h1>CIED Präoperative Checkliste</h1>
      </div>
      <button class="reset-btn" onclick="resetAll()">↺ Neu</button>
    </div>
    <div class="progress-label">
      <span>Fortschritt</span>
      <strong id="progressText">0 von 0 Punkten</strong>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main">

  <!-- Section navigation pills -->
  <div class="section-nav" id="sectionNav"></div>

  <!-- Checklist view -->
  <div class="view active" id="checklistView">
    <div id="sectionsContainer"></div>
  </div>

  <!-- Summary view -->
  <div class="view" id="summaryView">
    <div class="summary-card" id="summaryCard"></div>
  </div>

</main>

<!-- FAB -->
<button class="fab" id="summaryFab" onclick="showSummary()">
  <div class="fab-dot"></div>
  Auswertung
</button>

<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
const INFO = {
  leitlinien: {
    title: "Leitlinien-Grundlage",
    body: `<h4>Relevante ESC-Leitlinien</h4>
<ul>
  <li><strong>2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy</strong> – Indikationen für Schrittmacher, ICD und CRT</li>
  <li><strong>2022 ESC Guidelines – ventricular arrhythmias & sudden cardiac death</strong> – ICD-Indikationen primär/sekundärprophylaktisch</li>
  <li><strong>2021/2023 ESC Guidelines – heart failure</strong> – CRT-Indikation bei Herzinsuffizienz</li>
  <li><strong>2023 ESC Guidelines – endocarditis</strong> – Management infizierter CIEDs</li>
  <li><strong>2017 HRS Expert Consensus – Lead Management and Extraction</strong></li>
  <li><strong>2025 EHRA Consensus – Upgrades and Downgrades</strong></li>
</ul>
<div class="ref-box">Vor jedem Eingriff muss geprüft werden, ob die Indikation den aktuellen Leitlinien entspricht. Unnötige Implantationen sind zu vermeiden.</div>`
  },
  indikation: {
    title: "Indikationsprüfung",
    body: `<h4>Warum eine erneute Prüfung?</h4>
<p>Auch bei bereits geplanten Eingriffen muss unmittelbar präoperativ eine erneute Indikationsprüfung erfolgen – klinische Situation, Rhythmusstatus und Patientenwunsch können sich geändert haben.</p>
<h4>Zu prüfende Punkte</h4>
<ul>
  <li>Entspricht die Indikation noch der aktuellen Leitlinie?</li>
  <li>Wie ist die aktuelle Rhythmussituation (Holter, Telemetrie)?</li>
  <li>LVEF aktuell bekannt (nicht älter als 4 Wochen)?</li>
  <li>Hat der Patient Fragen oder Bedenken?</li>
</ul>
<div class="highlight-box">⚠ Unnötige CIED-Eingriffe sind mit Komplikationsrisiken verbunden (Infektion, Blutung, Sondendislokation) und müssen vermieden werden.</div>`
  },
  aufklaerung: {
    title: "Patientenaufklärung",
    body: `<h4>Rechtliche Grundlage</h4>
<p>Ein CIED-Eingriff ohne ordnungsgemäße Aufklärung und dokumentierte Einwilligung ist rechtlich nicht zulässig. Der unterschriebene Aufklärungsbogen muss im klinikeigenen EDV-System eingescannt sein.</p>
<h4>Aufzuklärende Risiken</h4>
<ul>
  <li>Infektion (Aggregattasche, Sonden, Endokarditis)</li>
  <li>Blutung, Aggregattaschenhämatom</li>
  <li>Pneumothorax / Hämatothorax</li>
  <li>Sondendislokation mit Funktionsverlust</li>
  <li>Trikuspidalklappeninsuffizienz (sondenbedingt)</li>
  <li>Arrhythmien perioperativ</li>
  <li>Myokard- oder Gefäßverletzung (ggf. Sternotomie)</li>
  <li>Sondenperforation, Perikardtamponade</li>
  <li>Tod</li>
</ul>`
  },
  implantatausweis: {
    title: "Implantatausweis",
    body: `<h4>Warum ist der Implantatausweis wichtig?</h4>
<p>Der Implantatausweis enthält essenzielle Informationen für Planung und Notfallmanagement:</p>
<ul>
  <li>Device-Typ und Hersteller</li>
  <li>Modell- und Seriennummer von Aggregat und Sonden</li>
  <li>Implantationsdatum</li>
  <li>Anzahl und Typ der Sonden</li>
</ul>
<p>Diese Daten sind notwendig für die Programmierung, die Extraktionsplanung und zur schnellen Identifikation des Geräts im Notfall (z.B. MRT-Kompatibilität).</p>
<div class="highlight-box">⚠ Ohne eingescannten Implantatausweis sollte kein elektiver Eingriff beginnen.</div>`
  },
  dialyse: {
    title: "Dialysepflicht & Shuntarm",
    body: `<h4>Warum ist der Shuntarm relevant?</h4>
<p>Bei dialysepflichtigen Patienten ist der arteriovenöse Shunt (AV-Fistel) lebenswichtig. Eine Punktion der ipsilateralen Vena subclavia oder axillaris für die Sondenlage kann durch venöse Okklusion oder Thrombose den Shunt gefährden.</p>
<h4>Konsequenz</h4>
<ul>
  <li>Sondenimplantation immer kontralateral zum Shuntarm planen</li>
  <li>Bei unklarer Seite: präoperative Rücksprache mit Nephrologie</li>
  <li>Alternativzugänge (z.B. femoraler Zugang) erwägen</li>
</ul>`
  },
  infektionsfreiheit: {
    title: "Infektionsfreiheit als Voraussetzung",
    body: `<h4>Hintergrund</h4>
<p>CIED-Infektionen gehören zu den schwerwiegendsten Komplikationen in der Device-Therapie. Fremdmaterial (Aggregat + Sonden) kann bei vorbestehender Bakteriämie kontaminiert werden.</p>
<h4>Konsequenz einer CIED-Infektion</h4>
<ul>
  <li>Meist vollständige Systemexplantation erforderlich</li>
  <li>Erhöhte Morbidität und Mortalität</li>
  <li>Verlängerte Krankenhausaufenthalte</li>
  <li>Hohe Kosten und Belastung für den Patienten</li>
</ul>
<h4>Regel</h4>
<p><strong>Keine Körpertemperatur ≥ 38°C in den letzten 24 Stunden.</strong> Bei Fieber → Eingriff verschieben, Fokussuche und -behandlung.</p>
<div class="highlight-box">Ausnahme: Notfallimplantation bei vitaler Indikation (z.B. AV-Block III° mit Bradykardie).</div>

  const complete = done === total;
  const isOpen = true; // all open by default

  const items = s.items.map(i => renderItem(i)).join('');
  const alerts = (s.alerts || []).map(a => `
    <div class="alert-row ${a.type}">
      <span class="alert-icon">${a.type === 'danger' ? '🔴' : '⚠️'}</span>
      <span class="alert-text">${a.text}</span>
    </div>`).join('');

  return `
  <div class="section-card ${complete ? 'complete' : ''} open" id="${s.id}">
    <div class="section-header" onclick="toggleSection('${s.id}')">
      <div class="section-num">${complete ? '✓' : s.num}</div>
      <div class="section-title-wrap">
        <div class="section-title">${s.title}${s.conditional ? `<span class="conditional-badge">Wenn vorhanden</span>` : ''}</div>
        <div class="section-subtitle">${s.subtitle}</div>
      </div>
      <div class="section-status">
        <span class="section-count ${complete ? 'done' : ''}">${done}/${total}</span>
        <span class="chevron">⌄</span>
      </div>
    </div>
    <div class="section-body">
      ${items}
      ${alerts}
    </div>
  </div>`;
}

function renderItem(item) {
  const checked = state[item.id];
  const cls = [
    checked ? 'checked' : '',
    item.warning ? 'warning' : '',
    item.critical ? 'critical' : ''
  ].filter(Boolean).join(' ');

  const infoBtn = item.info ? `<button class="info-btn" onclick="showInfo(event,'${item.info}')" title="Hintergrundinfo">i</button>` : '';

  return `
  <div class="check-item ${cls}" onclick="toggleItem('${item.id}')">
    <div class="checkbox"><span class="checkbox-check">✓</span></div>
    <div class="check-content">
      <div class="check-label">
        ${item.required ? '<span class="required-star">★</span>' : ''}
        ${item.label}
      </div>
      ${item.note ? `<div class="check-note">${item.note}</div>` : ''}
    </div>
    ${infoBtn}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════
function toggleItem(id) {
  state[id] = !state[id];
  refreshAll();
}

function toggleSection(id) {
  const card = document.getElementById(id);
  card.classList.toggle('open');
}

function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  // Open if closed
  document.getElementById(id)?.classList.add('open');
}

function refreshAll() {
  // Update items in DOM without full re-render
  SECTIONS.forEach(s => {
    const card = document.getElementById(s.id);
    if (!card) return;
    s.items.forEach(i => {
      const el = card.querySelector(`[onclick="toggleItem('${i.id}')"]`);
      if (!el) return;
      if (state[i.id]) { el.classList.add('checked'); }
      else { el.classList.remove('checked'); }
    });
    const done = s.items.filter(i => state[i.id]).length;
    const total = s.items.length;
    const complete = done === total;
    card.querySelector('.section-count').textContent = `${done}/${total}`;
    card.querySelector('.section-count').className = `section-count ${complete ? 'done' : ''}`;
    card.querySelector('.section-num').textContent = complete ? '✓' : s.num;
    if (complete) card.classList.add('complete'); else card.classList.remove('complete');
  });
  updateProgress();
  renderNav();
}

function updateProgress() {
  const total = Object.keys(state).length;
  const done = Object.values(state).filter(Boolean).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} von ${total} Punkten`;
}

function doReset() {
  Object.keys(state).forEach(k => state[k] = false);
  document.getElementById('checklistView').classList.add('active');
  document.getElementById('summaryView').classList.remove('active');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetAll() {
  if (!confirm('Checkliste zurücksetzen?')) return;
  doReset();
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
function showInfo(event, key) {
  event.stopPropagation();
  const info = INFO[key];
  if (!info) return;
  document.getElementById('modalTitle').textContent = info.title;
  document.getElementById('modalBody').innerHTML = info.body;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(event) {
  if (event.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

// ═══════════════════════════════════════════════════════
// SUMMARY
// ═══════════════════════════════════════════════════════
function showSummary() {
  const summaryView = document.getElementById('summaryView');
  const checklistView = document.getElementById('checklistView');

  const rows = SECTIONS.map(s => {
    const total = s.items.length;
    const done = s.items.filter(i => state[i.id]).length;
    const required = s.items.filter(i => i.required);
    const requiredDone = required.filter(i => state[i.id]).length;
    const allRequired = requiredDone === required.length;
    const allDone = done === total;
    const cls = allDone ? 'ok' : allRequired ? 'warn' : 'incomplete';
    const icon = allDone ? '✅' : allRequired ? '⚠️' : '❌';
    return `<div class="summary-row ${cls}">
      <span class="summary-row-icon">${icon}</span>
      <span class="summary-row-text">${s.num}. ${s.title}</span>
      <span class="summary-row-count">${done}/${total}</span>
    </div>`;
  }).join('');

  const total = Object.keys(state).length;
  const done = Object.values(state).filter(Boolean).length;
  const pct = Math.round(done / total * 100);

  const requiredItems = SECTIONS.flatMap(s => s.items.filter(i => i.required));
  const requiredDone = requiredItems.filter(i => state[i.id]).length;
  const allRequired = requiredDone === requiredItems.length;

  const statusText = allRequired && done === total
    ? '✅ Alle Maßnahmen abgeschlossen'
    : allRequired
    ? '⚠️ Pflichtmaßnahmen erfüllt – optionale Punkte offen'
    : `❌ ${requiredItems.length - requiredDone} Pflichtmaßnahme(n) fehlen noch`;

  document.getElementById('summaryCard').innerHTML = `
    <div class="summary-header">
      <h2>${statusText}</h2>
      <p>${done} von ${total} Punkten erledigt (${pct}%)</p>
    </div>
    <div class="summary-body">${rows}</div>
    <div class="summary-actions">
      <button class="btn-secondary" onclick="backToChecklist()">← Zurück</button>
      <button class="btn-primary" onclick="doReset()">↺ Neue Checkliste</button>
    </div>`;

  checklistView.classList.remove('active');
  summaryView.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToChecklist() {
  document.getElementById('summaryView').classList.remove('active');
  document.getElementById('checklistView').classList.add('active');
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
