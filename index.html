<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIED Präoperative Checkliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2744;
  --navy-light: #234b75;
  --blue: #2563a8;
  --blue-bright: #3b82f6;
  --sky: #e8f0fb;
  --sky-dark: #cdddf5;
  --white: #ffffff;
  --off-white: #f7f9fc;
  --gray-100: #eef1f6;
  --gray-200: #e2e8f0;
  --gray-300: #c8d0dd;
  --gray-500: #7a8899;
  --gray-700: #3d4a5c;
  --text: #1a2535;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --amber-border: #fbbf24;
  --red: #b91c1c;
  --red-light: #fef2f2;
  --red-border: #fca5a5;
  --green: #15803d;
  --green-light: #f0fdf4;
  --green-border: #86efac;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(15,39,68,0.08), 0 4px 16px rgba(15,39,68,0.06);
  --shadow-lg: 0 8px 32px rgba(15,39,68,0.12), 0 2px 8px rgba(15,39,68,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── HEADER ── */
.app-header {
  background: var(--navy);
  color: white;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.header-inner {
  max-width: 820px; margin: 0 auto;
  padding: 14px 20px 0;
}
.header-top {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.header-logo {
  width: 34px; height: 34px; background: var(--blue-bright);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.header-title { flex: 1; }
.header-title h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.reset-btn {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8); border-radius: 6px; padding: 6px 12px;
  font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s;
}
.reset-btn:hover { background: rgba(255,255,255,0.18); color: white; }

/* ── TAB BAR ── */
.tab-bar { display: flex; }
.tab-btn {
  flex: 1; padding: 10px 16px;
  background: transparent; border: none;
  color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 600;
  font-family: 'DM Sans', sans-serif; cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.tab-btn:hover { color: rgba(255,255,255,0.8); }
.tab-btn.active { color: white; border-bottom-color: var(--blue-bright); }
.tab-badge {
  background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7);
  font-size: 10px; font-weight: 700; padding: 1px 6px;
  border-radius: 100px; font-family: 'DM Mono', monospace;
}
.tab-btn.active .tab-badge { background: var(--blue-bright); color: white; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }
.main { max-width: 820px; margin: 0 auto; padding: 20px 16px 80px; }

/* ══════════════════════════════════════════
   QUICK CHECK
══════════════════════════════════════════ */
.quick-intro {
  background: var(--sky); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 16px;
  border-left: 4px solid var(--blue-bright);
  font-size: 13px; color: var(--gray-700); line-height: 1.5;
}
.quick-intro strong { color: var(--navy); }

/* Progress */
.qc-progress {
  background: white; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 20px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 16px;
}
.progress-ring-wrap { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
.progress-ring-wrap svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--gray-100); stroke-width: 5; }
.ring-fill {
  fill: none; stroke: var(--blue-bright); stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 163; stroke-dashoffset: 163;
  transition: stroke-dashoffset 0.5s cubic-bezier(0.4,0,0.2,1);
}
.ring-fill.complete { stroke: var(--green); }
.ring-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--navy);
  font-family: 'DM Mono', monospace;
}
.progress-info h3 { font-size: 15px; font-weight: 700; color: var(--navy); }
.progress-info p { font-size: 13px; color: var(--gray-500); margin-top: 2px; }

/* Section label */
.qc-section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--gray-500);
  padding: 16px 4px 6px; display: flex; align-items: center; gap: 8px;
}
.qc-section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--gray-200);
}

/* Quick item card */
.qc-card {
  background: white; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 8px;
  overflow: hidden; border: 1.5px solid transparent; transition: border-color 0.2s;
}
.qc-card.done { border-color: var(--green-border); }

.qc-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px; cursor: pointer; transition: background 0.12s;
}
.qc-item:hover { background: var(--off-white); }
.qc-item.checked { background: var(--green-light); }
.qc-item.warn-item { border-left: 3px solid var(--amber-border); }
.qc-item.warn-item.checked { background: #dcfce7; }

.qc-box {
  width: 26px; height: 26px; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--gray-300); border-radius: 7px;
  background: white; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-size: 14px; color: white;
}
.qc-item.checked .qc-box { background: var(--green); border-color: var(--green); }

.qc-content { flex: 1; min-width: 0; }
.qc-label {
  font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.35;
}
.qc-item.checked .qc-label { color: var(--gray-500); text-decoration: line-through; font-weight: 400; }
.qc-sub { font-size: 12px; color: var(--gray-500); margin-top: 3px; line-height: 1.4; }
.qc-item.checked .qc-sub { color: var(--gray-300); }

.qc-tag {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 100px;
  letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; margin-top: 3px;
  white-space: nowrap;
}
.tag-cond { background: var(--gray-100); color: var(--gray-500); }
.tag-warn { background: var(--amber-light); color: var(--amber); }

.info-btn {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--sky-dark); background: var(--sky);
  color: var(--blue); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; margin-top: 3px;
  transition: all 0.15s;
}
.info-btn:hover { background: var(--blue); color: white; border-color: var(--blue); }

/* ══════════════════════════════════════════
   DETAIL CHECKLIST
══════════════════════════════════════════ */
.section-card {
  background: white; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 10px;
  overflow: hidden; border: 1.5px solid transparent; transition: border-color 0.2s;
}
.section-card.complete { border-color: var(--green-border); }
.section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; cursor: pointer; user-select: none; transition: background 0.15s;
}
.section-header:hover { background: var(--off-white); }
.section-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--sky); color: var(--blue);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.section-card.complete .section-num { background: var(--green-light); color: var(--green); }
.section-title-wrap { flex: 1; min-width: 0; }
.section-title { font-size: 14px; font-weight: 600; color: var(--navy); line-height: 1.3; }
.section-subtitle { font-size: 11px; color: var(--gray-500); margin-top: 1px; }
.section-status { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.section-count { font-size: 12px; color: var(--gray-500); font-family: 'DM Mono', monospace; }
.section-count.done { color: var(--green); }
.chevron { font-size: 16px; color: var(--gray-300); transition: transform 0.25s; }
.section-card.open .chevron { transform: rotate(180deg); }
.section-body { display: none; border-top: 1px solid var(--gray-100); }
.section-card.open .section-body { display: block; }

.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 16px; border-bottom: 1px solid var(--gray-100);
  transition: background 0.12s; cursor: pointer;
}
.check-item:last-child { border-bottom: none; }
.check-item:hover { background: var(--off-white); }
.check-item.checked { background: var(--green-light); }
.check-item.warning { background: var(--amber-light); border-left: 3px solid var(--amber-border); }
.check-item.warning.checked { background: #dcfce7; }

.checkbox {
  width: 22px; height: 22px; border: 2px solid var(--gray-300); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px; transition: all 0.15s; background: white;
}
.check-item.checked .checkbox { background: var(--green); border-color: var(--green); color: white; }
.checkbox-check { font-size: 13px; display: none; }
.check-item.checked .checkbox-check { display: block; }
.check-content { flex: 1; min-width: 0; }
.check-label { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.4; }
.check-item.checked .check-label { color: var(--gray-500); text-decoration: line-through; }
.required-star { color: var(--red); font-size: 13px; }
.check-note { font-size: 12px; color: var(--gray-500); margin-top: 2px; font-style: italic; }

.alert-row {
  display: flex; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid var(--gray-100); align-items: flex-start;
}
.alert-row.warning { background: var(--amber-light); }
.alert-row.danger { background: var(--red-light); }
.alert-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.alert-text { font-size: 13px; color: var(--gray-700); line-height: 1.5; }

.conditional-badge {
  display: inline-flex; align-items: center;
  background: var(--navy); color: white;
  font-size: 10px; font-weight: 600; padding: 2px 7px;
  border-radius: 100px; letter-spacing: 0.04em; text-transform: uppercase; margin-left: 6px;
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,20,40,0.55);
  z-index: 200; display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px); padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white; border-radius: var(--radius) var(--radius) 12px 12px;
  max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.25s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-header {
  background: var(--navy); color: white; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; border-radius: var(--radius) var(--radius) 0 0;
}
.modal-title { font-size: 14px; font-weight: 600; }
.modal-close {
  width: 28px; height: 28px; background: rgba(255,255,255,0.15); border: none;
  border-radius: 6px; color: white; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.modal-close:hover { background: rgba(255,255,255,0.25); }
.modal-body { padding: 20px; font-size: 14px; line-height: 1.7; color: var(--gray-700); }
.modal-body h4 {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--blue); margin: 16px 0 6px;
}
.modal-body h4:first-child { margin-top: 0; }
.modal-body p { margin-bottom: 10px; }
.modal-body ul { padding-left: 18px; }
.modal-body ul li { margin-bottom: 5px; }
.modal-body .highlight-box {
  background: var(--amber-light); border-left: 3px solid var(--amber);
  border-radius: 0 6px 6px 0; padding: 10px 14px; margin: 12px 0; font-size: 13px;
}
.modal-body .ref-box {
  background: var(--sky); border-radius: 6px;
  padding: 10px 14px; margin-top: 16px; font-size: 12px; color: var(--gray-500); font-style: italic;
}

/* ── FAB ── */
.fab {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--navy); color: white; border: none; border-radius: 50px;
  padding: 13px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 20px rgba(15,39,68,0.3); font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; gap: 8px; transition: all 0.2s; z-index: 90;
}
.fab:hover { background: var(--blue); transform: translateY(-2px); }
.fab-dot {
  width: 7px; height: 7px; background: var(--blue-bright);
  border-radius: 50%; animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.6; transform:scale(0.8); }
}

/* ── SUMMARY ── */
.summary-card {
  background: white; border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid var(--gray-200);
}
.summary-header { background: var(--navy); color: white; padding: 20px; text-align: center; }
.summary-header h2 { font-size: 18px; font-weight: 700; line-height: 1.3; }
.summary-header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }
.summary-body { padding: 16px 20px; }
.summary-section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--gray-500); margin: 16px 0 8px;
}
.summary-section-label:first-child { margin-top: 0; }
.summary-row {
  display: flex; align-items: center; padding: 10px 14px;
  border-radius: 8px; margin-bottom: 5px; font-size: 14px; gap: 10px;
}
.summary-row.ok { background: var(--green-light); color: var(--green); }
.summary-row.warn { background: var(--amber-light); color: var(--amber); }
.summary-row.incomplete { background: var(--red-light); color: var(--red); }
.summary-row-icon { font-size: 15px; flex-shrink: 0; }
.summary-row-text { flex: 1; font-weight: 500; }
.summary-row-count { font-family: 'DM Mono', monospace; font-size: 12px; }
.summary-actions { display: flex; gap: 10px; padding: 0 20px 20px; }
.btn-primary {
  flex: 1; padding: 12px; background: var(--navy); color: white; border: none;
  border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: background 0.15s;
}
.btn-primary:hover { background: var(--navy-light); }
.btn-secondary {
  flex: 1; padding: 12px; background: white; color: var(--navy);
  border: 1.5px solid var(--gray-300); border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all 0.15s;
}
.btn-secondary:hover { border-color: var(--navy); }

@media (max-width: 600px) {
  .fab { bottom: 16px; right: 16px; padding: 11px 16px; font-size: 12px; }
  .tab-btn { font-size: 12px; padding: 10px 10px; }
}
</style>
</head>
<body>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Information</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- HEADER -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="header-logo">🫀</div>
      <div class="header-title">
        <h1>CIED Präoperative Checkliste</h1>
      </div>
      <button class="reset-btn" onclick="resetAll()">↺ Neu</button>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabQuick" onclick="switchTab('quick')">
        ⚡ Quick-Check
        <span class="tab-badge" id="quickBadge">0/11</span>
      </button>
      <button class="tab-btn" id="tabDetail" onclick="switchTab('detail')">
        ☰ Vollständige Checkliste
        <span class="tab-badge" id="detailBadge">0/55</span>
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div class="view active" id="viewQuick">
    <div class="qc-progress">
      <div class="progress-ring-wrap">
        <svg width="60" height="60" viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="26"/>
          <circle class="ring-fill" id="ringFill" cx="30" cy="30" r="26"/>
        </svg>
        <div class="ring-text" id="ringText">0%</div>
      </div>
      <div class="progress-info">
        <h3 id="progressTitle">Checkliste starten</h3>
        <p id="progressSub">Pflichtpunkte vor dem Eingriff abhaken</p>
      </div>
    </div>
    <div class="quick-intro">
      <strong>Pflichtpunkte vor jedem CIED-Eingriff.</strong>
      Graue Tags = nur wenn zutreffend. Tippen Sie auf <strong>ℹ</strong> für Hintergrundinformationen.
    </div>
    <div id="quickItems"></div>
  </div>

  <div class="view" id="viewDetail">
    <div id="sectionsContainer"></div>
  </div>

  <div class="view" id="viewSummary">
    <div class="summary-card" id="summaryCard"></div>
  </div>
</main>

<button class="fab" id="summaryFab" onclick="showSummary()">
  <div class="fab-dot"></div>
  Auswertung
</button>

<script>
// ═══════════════════════════════════════════
// INFO CONTENT
// ═══════════════════════════════════════════
const INFO = {
  leitlinien: {
    title: "Leitlinien-Grundlage",
    body: `<h4>Relevante ESC-Leitlinien</h4>
<ul>
  <li><strong>2021 ESC Guidelines on cardiac pacing and CRT</strong> – Schrittmacher, ICD, CRT</li>
  <li><strong>2022 ESC Guidelines – ventricular arrhythmias & SCD</strong> – ICD primär-/sekundärprophylaktisch</li>
  <li><strong>2021/2023 ESC Guidelines – heart failure</strong> – CRT-Indikation</li>
  <li><strong>2023 ESC Guidelines – endocarditis</strong> – Management infizierter CIEDs</li>
  <li><strong>2025 EHRA Consensus – Upgrades and Downgrades</strong></li>
</ul>
<div class="highlight-box">⚠ Vor jedem Eingriff: erneute Indikationsprüfung zwingend. Unnötige Implantationen vermeiden.</div>`
  },
  kis: {
    title: "Dokumentation im KIS",
    body: `<h4>Warum ist die KIS-Dokumentation Pflicht?</h4>
<p>Der unterschriebene Aufklärungsbogen und der Implantatausweis müssen im klinikeigenen KIS eingescannt und hinterlegt sein, bevor der Eingriff beginnt.</p>
<h4>Aufklärung – aufzuklärende Risiken</h4>
<ul>
  <li>Infektion (Aggregattasche, Sonden, Endokarditis)</li>
  <li>Blutung, Aggregattaschenhämatom</li>
  <li>Pneumothorax / Hämatothorax</li>
  <li>Sondendislokation mit Funktionsverlust</li>
  <li>Trikuspidalklappeninsuffizienz (sondenbedingt)</li>
  <li>Arrhythmien perioperativ</li>
  <li>Myokard-/Gefäßverletzung (ggf. Sternotomie)</li>
  <li>Sondenperforation, Perikardtamponade</li>
  <li>Tod</li>
</ul>
<h4>Implantatausweis</h4>
<p>Enthält: Device-Typ, Hersteller, Modell-/Seriennummer, Implantationsdatum, Sondentypen. Essenziell für Programmierung, Extraktionsplanung und Notfallmanagement.</p>`
  },
  shunt: {
    title: "Shuntarm bei Dialysepatienten",
    body: `<h4>Warum ist der Shuntarm relevant?</h4>
<p>Der arteriovenöse Shunt (AV-Fistel) ist für dialysepflichtige Patienten lebensnotwendig. Eine Punktion der ipsilateralen V. subclavia oder V. axillaris kann durch venöse Okklusion den Shunt gefährden.</p>
<h4>Konsequenz</h4>
<ul>
  <li>Sondenimplantation immer <strong>kontralateral</strong> zum Shuntarm planen</li>
  <li>Bei unklarer Seite: Rücksprache mit Nephrologie</li>
  <li>Alternativzugänge (z.B. femoraler Zugang) erwägen</li>
</ul>
<div class="highlight-box">⚠ Seite des Shuntarmes muss präoperativ zwingend dokumentiert und kommuniziert sein.</div>`
  },
  infektion: {
    title: "Infektionsfreiheit als Voraussetzung",
    body: `<h4>Hintergrund</h4>
<p>CIED-Infektionen gehören zu den schwerwiegendsten Komplikationen. Kontaminiertes Fremdmaterial führt meist zur vollständigen Systemexplantation mit erhöhter Morbidität und Mortalität.</p>
<h4>Regel</h4>

// ═══════════════════════════════════════════
function renderQuick() {
  let html = '';
  QUICK_GROUPS.forEach(g => {
    html += `<div class="qc-section-label">${g.group}</div>`;
    g.items.forEach(item => {
      const checked = qState[item.id];
      const cls = [checked ? 'checked' : '', item.warn ? 'warn-item' : ''].filter(Boolean).join(' ');
      const infoBtn = item.info ? `<button class="info-btn" onclick="showInfo(event,'${item.info}')">i</button>` : '';
      const tag = item.conditional ? `<span class="qc-tag tag-cond">Wenn zutreffend</span>`
        : item.warn ? `<span class="qc-tag tag-warn">Kritisch</span>` : '';
      html += `<div class="qc-card ${checked ? 'done' : ''}">
        <div class="qc-item ${cls}" onclick="toggleQuick('${item.id}')">
          <div class="qc-box">${checked ? '✓' : ''}</div>
          <div class="qc-content">
            <div class="qc-label">${item.label}</div>
            ${item.sub ? `<div class="qc-sub">${item.sub}</div>` : ''}
          </div>
          ${tag}${infoBtn}
        </div>
      </div>`;
    });
  });
  document.getElementById('quickItems').innerHTML = html;
  updateRing();
}

function toggleQuick(id) {
  qState[id] = !qState[id];
  renderQuick();
  updateBadges();
}

function updateRing() {
  const total = Object.keys(qState).length;
  const done = Object.values(qState).filter(Boolean).length;
  const pct = Math.round(done / total * 100);
  const offset = 163 - (163 * pct / 100);
  const ring = document.getElementById('ringFill');
  ring.style.strokeDashoffset = offset;
  ring.className = `ring-fill${done === total ? ' complete' : ''}`;
  document.getElementById('ringText').textContent = pct + '%';
  const title = document.getElementById('progressTitle');
  const sub = document.getElementById('progressSub');
  if (done === 0) {
    title.textContent = 'Checkliste starten';
    sub.textContent = 'Pflichtpunkte vor dem Eingriff abhaken';
  } else if (done === total) {
    title.textContent = '✅ Quick-Check abgeschlossen';
    sub.textContent = 'Alle Punkte erledigt';
  } else {
    title.textContent = `${done} von ${total} Punkten erledigt`;
    sub.textContent = `Noch ${total - done} Punkt${total - done !== 1 ? 'e' : ''} offen`;
  }
}

function renderDetail() {
  document.getElementById('sectionsContainer').innerHTML = SECTIONS.map(s => {
    const done = s.items.filter(i => dState[i.id]).length;
    const total = s.items.length;
    const complete = done === total;
    const items = s.items.map(item => {
      const checked = dState[item.id];
      const cls = [checked ? 'checked' : '', item.warning ? 'warning' : ''].filter(Boolean).join(' ');
      const infoBtn = item.info ? `<button class="info-btn" onclick="showInfo(event,'${item.info}')">i</button>` : '';
      return `<div class="check-item ${cls}" onclick="toggleDetail('${item.id}')">
        <div class="checkbox"><span class="checkbox-check">✓</span></div>
        <div class="check-content">
          <div class="check-label">${item.required ? '<span class="required-star">★ </span>' : ''}${item.label}</div>
          ${item.note ? `<div class="check-note">${item.note}</div>` : ''}
        </div>${infoBtn}
      </div>`;
    }).join('');
    const alerts = (s.alerts||[]).map(a =>
      `<div class="alert-row ${a.type}"><span class="alert-icon">${a.type==='danger'?'🔴':'⚠️'}</span><span class="alert-text">${a.text}</span></div>`
    ).join('');
    return `<div class="section-card ${complete?'complete':''} open" id="${s.id}">
      <div class="section-header" onclick="toggleSection('${s.id}')">
        <div class="section-num">${complete?'✓':s.num}</div>
        <div class="section-title-wrap">
          <div class="section-title">${s.title}${s.conditional?'<span class="conditional-badge">Wenn zutreffend</span>':''}</div>
          <div class="section-subtitle">${s.subtitle}</div>

      </div>
      <div class="section-body">${items}${alerts}</div>
    </div>`;
  }).join('');
}

}
function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

// ═══════════════════════════════════════════
// SUMMARY
// ═══════════════════════════════════════════
function showSummary() {
  const qTotal = Object.keys(qState).length;
  const qDone = Object.values(qState).filter(Boolean).length;
  const dTotal = Object.keys(dState).length;
  const dDone = Object.values(dState).filter(Boolean).length;

  const quickRows = QUICK_GROUPS.map(g => {
    const gDone = g.items.filter(i => qState[i.id]).length;
    const gTotal = g.items.length;
    const cls = gDone === gTotal ? 'ok' : gDone > 0 ? 'warn' : 'incomplete';
    const icon = gDone === gTotal ? '✅' : gDone > 0 ? '⚠️' : '❌';
    return `<div class="summary-row ${cls}">
      <span class="summary-row-icon">${icon}</span>
      <span class="summary-row-text">${g.group}</span>
      <span class="summary-row-count">${gDone}/${gTotal}</span>
    </div>`;
  }).join('');

  const detailRows = SECTIONS.map(s => {
    const sDone = s.items.filter(i => dState[i.id]).length;
    const sTotal = s.items.length;
    const cls = sDone === sTotal ? 'ok' : sDone > 0 ? 'warn' : 'incomplete';
    const icon = sDone === sTotal ? '✅' : sDone > 0 ? '⚠️' : '❌';
    return `<div class="summary-row ${cls}">
      <span class="summary-row-icon">${icon}</span>
      <span class="summary-row-text">${s.num}. ${s.title}</span>
      <span class="summary-row-count">${sDone}/${sTotal}</span>
    </div>`;
  }).join('');

  const statusText = qDone === qTotal ? '✅ Quick-Check vollständig'
    : qDone >= Math.ceil(qTotal * 0.8) ? '⚠️ Fast vollständig'
    : `❌ ${qTotal - qDone} Quick-Check-Punkte offen`;

  document.getElementById('summaryCard').innerHTML = `
    <div class="summary-header">
      <h2>${statusText}</h2>
      <p>Quick-Check: ${qDone}/${qTotal} · Vollständige Checkliste: ${dDone}/${dTotal}</p>
    </div>
    <div class="summary-body">
      <div class="summary-section-label">Quick-Check</div>
      ${quickRows}
      <div class="summary-section-label">Vollständige Checkliste</div>
      ${detailRows}
    </div>
    <div class="summary-actions">
      <button class="btn-secondary" onclick="backFromSummary()">← Zurück</button>
      <button class="btn-primary" onclick="doReset()">↺ Neue Checkliste</button>
    </div>`;

  document.getElementById('viewQuick').classList.remove('active');
  document.getElementById('viewDetail').classList.remove('active');
  document.getElementById('viewSummary').classList.add('active');
  document.getElementById('summaryFab').style.display = 'none';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function backFromSummary() {
  document.getElementById('viewSummary').classList.remove('active');
  document.getElementById('summaryFab').style.display = 'flex';
  document.getElementById('viewQuick').classList.toggle('active', prevTab === 'quick');
  document.getElementById('viewDetail').classList.toggle('active', prevTab === 'detail');
  document.getElementById('tabQuick').classList.toggle('active', prevTab === 'quick');
  document.getElementById('tabDetail').classList.toggle('active', prevTab === 'detail');
}

// ═══════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════
function doReset() {
  Object.keys(qState).forEach(k => qState[k] = false);
  Object.keys(dState).forEach(k => dState[k] = false);
  prevTab = 'quick';
  renderQuick();
  renderDetail();
  updateBadges();
  document.getElementById('viewSummary').classList.remove('active');
  document.getElementById('viewDetail').classList.remove('active');
  document.getElementById('viewQuick').classList.add('active');
  document.getElementById('tabQuick').classList.add('active');
  document.getElementById('tabDetail').classList.remove('active');
  document.getElementById('summaryFab').style.display = 'flex';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetAll() {
  if (!confirm('Checkliste zurücksetzen?')) return;
  doReset();
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderQuick();
renderDetail();
updateBadges();
</script>
</body>
</html>
